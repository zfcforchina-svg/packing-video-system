<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>条码自测</title>
<style>body{font-family:monospace;padding:16px;background:#111;color:#fff;line-height:1.8}
.g{color:#4ade80}.y{color:#fbbf24}.r{color:#f87171}.m{color:#94a3b8}</style></head><body>
<h2>条码识别自测</h2>
<div id="log"></div><br>
<input type="file" id="real" capture="environment" accept="image/*" style="display:none">
<button id="btnTest" style="padding:14px 24px;font-size:16px;background:#2563eb;color:#fff;border:none;border-radius:8px">📸 拍真实快递面单测试</button>
<div id="imgContainer"></div>
<script src="/js/vendor/html5-qrcode.min.js"></script>
<script>
const logEl=document.getElementById('log');
const btnTest=document.getElementById('btnTest');
const realInput=document.getElementById('real');
const container=document.getElementById('imgContainer');
let imgEl=null;

function log(s,c=''){logEl.innerHTML+=`<span class="${c}">${s}</span><br>`;}

async function decodeFile(file,label){
  log(`--- ${label} ---`,'m');
  log(`类型: ${file.type}, 大小: ${(file.size/1024).toFixed(1)}KB`,'m');

  // Method 1: Native BarcodeDetector on image
  if('BarcodeDetector' in window){
    try{
      if(!imgEl){imgEl=document.createElement('img');imgEl.style.maxWidth='300px';container.appendChild(imgEl);}
      const url=URL.createObjectURL(file);
      imgEl.src=url;
      await new Promise((r,rej)=>{imgEl.onload=r;imgEl.onerror=rej;});
      const detector=new BarcodeDetector({formats:['code_128','code_39','ean_13','ean_8','qr_code']});
      const codes=await detector.detect(imgEl);
      URL.revokeObjectURL(url);
      if(codes.length>0){
        for(const c of codes) log(`✅ Native BarcodeDetector: "${c.rawValue}" (${c.format})`,'g');
        return codes[0].rawValue;
      }
      log('Native BarcodeDetector: 未检测到条码','y');
    }catch(e){log(`Native BarcodeDetector 失败: ${e.message}`,'r');}
  }else{log('Native BarcodeDetector: 浏览器不支持','y');}

  // Method 2: html5-qrcode scanFile
  try{
    const scanner=new Html5Qrcode('imgContainer');
    const result=await scanner.scanFile(file,false);
    log(`✅ html5-qrcode scanFile: "${result}"`,'g');
    return result;
  }catch(e){
    log(`html5-qrcode scanFile 失败: ${e.message}`,'r');
  }

  log('❌ 所有方法都未能识别条码','r');
  return null;
}

// Pre-generated test barcodes
(async()=>{
  logEl.innerHTML='';
  log('=== 生成条码测试 ===','m');
  for(const [url,name] of [['/test-barcode.png','Code128-751234567890'],['/test-code39.png','Code39-3100000000000']]){
    try{
      const resp=await fetch(url);
      const blob=await resp.blob();
      const file=new File([blob],'test.png',{type:'image/png'});
      await decodeFile(file,name);
    }catch(e){log(`加载 ${name} 失败: ${e.message}`,'r');}
  }
  log('=== 生成条码测试完成 ===','m');
  log('现在点击下方按钮，用真实相机拍摄快递面单条码','y');
})();

// Real camera test
btnTest.onclick=()=>realInput.click();
realInput.onchange=async()=>{
  const file=realInput.files[0];
  if(!file)return;
  log(`📸 拍摄照片: ${file.name}`,'m');
  const result=await decodeFile(file,'真实快递面单');
  if(result){
    const clean=result.replace(/[^a-zA-Z0-9]/g,'');
    log(`🎉 单号: ${clean}`,'g');
  }else{
    log('❌ 未能识别，请确保条码清晰完整、光线充足','r');
  }
  realInput.value='';
};
</script>
</body></html>
