<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>打包录像</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,sans-serif;height:100vh;overflow:hidden}
#vid{width:100vw;height:100vh;object-fit:cover;position:fixed;top:0;left:0;z-index:1}
#ui{position:fixed;bottom:0;left:0;right:0;z-index:10;background:linear-gradient(transparent,rgba(0,0,0,0.85) 30%);padding:20px 16px 30px;display:flex;flex-direction:column;gap:8px}
#status{font-size:13px;text-align:center}
#tracking{font-size:28px;font-weight:700;text-align:center;min-height:40px}
#manual{width:100%;padding:12px;font-size:18px;text-align:center;background:rgba(255,255,255,0.1);color:#fff;border:2px solid rgba(255,255,255,0.2);border-radius:10px;outline:none}
#manual:focus{border-color:#2563eb}#manual::placeholder{color:rgba(255,255,255,0.3)}
.btn-row{display:flex;gap:8px}
.btn{flex:1;padding:16px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;text-align:center}
.btn:active{opacity:0.8}.btn:disabled{opacity:0.3}
.btn-stop{background:#1e293b;color:#fff}.btn-up{background:#2563eb;color:#fff}.btn-next{background:#059669;color:#fff}
.g{color:#4ade80}.y{color:#fbbf24}.r{color:#f87171}.hid{display:none!important}
#recBadge{position:fixed;top:16px;right:16px;z-index:20;background:rgba(220,38,38,0.9);padding:6px 14px;border-radius:20px;font-size:14px;font-weight:600;display:none;align-items:center;gap:8px}
#recBadge .dot{width:8px;height:8px;background:#fff;border-radius:50%;animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
</style></head><body>
<video id="vid" autoplay muted playsinline></video>
<div id="recBadge"><span class="dot"></span>录制 <span id="recTimer">00:00</span></div>
<div id="ui">
  <div id="status" class="y">⏳ 启动中...</div>
  <div id="tracking">将条码对准框内</div>
  <input type="text" id="manual" placeholder="或手动输入单号" inputmode="numeric" autocomplete="off">
  <div class="btn-row hid" id="btnRow">
    <button class="btn btn-stop" id="btnStop">⏹ 手动停止</button>
    <button class="btn btn-up" id="btnUp">☁️ 上传</button>
  </div>
  <button class="btn btn-next hid" id="btnNext">✅ 下一单</button>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=s=>document.querySelector(s);
const vid=$('#vid'),statusEl=$('#status'),trackingEl=$('#tracking'),manual=$('#manual');
const btnRow=$('#btnRow'),btnStop=$('#btnStop'),btnUp=$('#btnUp'),btnNext=$('#btnNext');
const recBadge=$('#recBadge'),recTimer=$('#recTimer');
let stream=null,running=false,busy=false,count=0;
let tracking='',videoBlob=null,socket=null,connected=false,focusApplied=false;
let recorder=null,recChunks=[],recStart=0,recInterval=0,isRecording=false;

async function init(){
  socket=io({reconnection:true});
  socket.on('connect',()=>connected=true);
  socket.on('disconnect',()=>connected=false);
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});}
  catch(e){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});}catch(e2){stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280}},audio:false});}}
  vid.srcObject=stream;await vid.play();
  try{const t=stream.getVideoTracks()[0],caps=t.getCapabilities(),adv=[];
    if(caps.focusMode&&caps.focusMode.includes('continuous'))adv.push({focusMode:'continuous'});
    if(caps.focusDistance&&caps.focusDistance.min<0.1)adv.push({focusDistance:caps.focusDistance.min});
    if(caps.zoom&&caps.zoom.max>=2)adv.push({zoom:2});
    if(adv.length)t.applyConstraints({advanced:adv});}catch(e){}
  statusEl.textContent='🔍 自动扫描中...';statusEl.className='y';running=true;scanLoop();setInterval(()=>{try{stream.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:'continuous'}]});}catch(e){}},5000);
  manual.oninput=()=>{const v=manual.value.replace(/[^a-zA-Z0-9]/g,'').trim();if(v.length>=4&&!isRecording){tracking=v;trackingEl.textContent='📦 '+tracking;trackingEl.className='g';startRec();}};
  btnStop.onclick=stopRec;btnUp.onclick=doUpload;btnNext.onclick=resetAll;
}

async function scanLoop(){
  if(!running)return;setTimeout(scanLoop,500);
  if(busy||vid.readyState<2||!vid.videoWidth)return;
  busy=true;count++;
  try{const c=document.createElement('canvas');c.width=vid.videoWidth;c.height=vid.videoHeight;
    c.getContext('2d').drawImage(vid,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
    const fd=new FormData();fd.append('image',blob);
    const resp=await fetch('/api/decode',{method:'POST',body:fd});const data=await resp.json();
    if(!isRecording)statusEl.textContent='🔍 #'+count;
    if(data.success&&data.tracking){const clean=data.tracking.replace(/[^a-zA-Z0-9]/g,'').trim();
      if(clean.length>=4&&clean!==tracking){tracking=clean;manual.value=tracking;
        trackingEl.textContent='📦 '+tracking;trackingEl.className='g';
        if(navigator.vibrate)navigator.vibrate(200);
        if(!isRecording){running=false;startRec();}}}
  }catch(e){}
  busy=false;
}

function startRec(){
  if(isRecording||!tracking)return;isRecording=true;recChunks=[];
  const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp8')?'video/webm;codecs=vp8':'video/webm';
  recorder=new MediaRecorder(stream,{mimeType:mime});
  recorder.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data);};
  recorder.onstop=()=>{clearInterval(recInterval);isRecording=false;recBadge.style.display='none';
    btnStop.classList.add('hid');btnUp.classList.remove('hid');
    videoBlob=new Blob(recChunks,{type:mime});statusEl.textContent='✅ 录像完成，上传中...';statusEl.className='g';doUpload();};
  recorder.start(1000);recStart=Date.now();
  recInterval=setInterval(()=>{const s=Math.floor((Date.now()-recStart)/1000);recTimer.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');},500);
  recBadge.style.display='flex';btnRow.classList.remove('hid');btnStop.classList.remove('hid');btnUp.classList.add('hid');btnNext.classList.add('hid');
  statusEl.textContent='🔴 录制中';statusEl.className='r';
}
function stopRec(){if(recorder&&recorder.state==='recording')recorder.stop();}

async function doUpload(){
  if(!videoBlob||!tracking)return;btnUp.disabled=true;btnUp.textContent='上传中...';
  if(!connected){statusEl.textContent='⚠️ 未连接，已存手机';statusEl.className='r';showNext();return;}
  const fid=tracking+'_'+Date.now(),sz=videoBlob.size,cs=256*1024,total=Math.ceil(sz/cs);
  try{await ws('upload:start',{fileId:fid,trackingNumber:tracking,totalSize:sz,duration:0});
    for(let i=0;i<total;i++){await ws('upload:chunk',{fileId:fid,index:i,data:await videoBlob.slice(i*cs,Math.min((i+1)*cs,sz)).arrayBuffer()});btnUp.textContent='☁️ '+Math.round((i+1)/total*100)+'%';}
    await ws('upload:complete',{fileId:fid});statusEl.textContent='✅ 上传完成 — '+tracking;statusEl.className='g';}
  catch(e){statusEl.textContent='⚠️ 上传失败，已存手机';statusEl.className='r';}
  showNext();
}
function ws(ev,d){return new Promise((r,rej)=>{const t=setTimeout(()=>rej(new Error('timeout')),120000);socket.emit(ev,d,x=>{clearTimeout(t);x?.error?rej(new Error(x.error)):r(x||{});});});}
function showNext(){btnUp.classList.add('hid');btnNext.classList.remove('hid');}

function resetAll(){
  tracking='';videoBlob=null;recorder=null;recChunks=[];count=0;isRecording=false;
  trackingEl.textContent='将条码对准框内';trackingEl.className='';manual.value='';
  btnRow.classList.add('hid');btnNext.classList.add('hid');btnUp.disabled=false;btnUp.textContent='☁️ 上传';
  recBadge.style.display='none';statusEl.textContent='🔍 重新扫描...';statusEl.className='y';running=true;scanLoop();
}
init();
</script>
</body></html>
