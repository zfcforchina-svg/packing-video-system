<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000">
<title>打包录像</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0a0a;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:500px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:12px;gap:10px}
h2{text-align:center;padding:8px 0 0;font-size:20px}
#conn{text-align:center;font-size:11px;min-height:18px}
.conn-ok{color:#4ade80}.conn-err{color:#f87171}

/* Big tracking input */
.input-group{background:#1a1a1a;border-radius:12px;padding:14px}
.input-group label{font-size:12px;color:#64748b;display:block;margin-bottom:6px}
#trackingInput{width:100%;padding:14px;font-size:22px;font-weight:700;text-align:center;
  background:#0a0a0a;color:#fff;border:2px solid #333;border-radius:10px;
  letter-spacing:2px;outline:none}
#trackingInput:focus{border-color:#2563eb}
#trackingInput::placeholder{color:#333;font-weight:400;font-size:16px}

/* Photo preview */
#scanPreview{width:100%;max-height:180px;object-fit:contain;border-radius:10px;display:none;background:#000}

/* Scan button row */
.btn-row{display:flex;gap:8px}
.btn{flex:1;padding:16px;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;text-align:center}
.btn:active{opacity:0.8}
.btn-blue{background:#2563eb;color:#fff}
.btn-red{background:#dc2626;color:#fff}
.btn-green{background:#059669;color:#fff}
.btn-purple{background:#7c3aed;color:#fff}
.btn-gray{background:#333;color:#aaa}
.btn:disabled{opacity:0.25}
.hid{display:none!important}

#recordInput{display:none}
#scanHelper{display:none}
#camView{width:100%;height:200px;background:#000;border-radius:10px;overflow:hidden;position:relative}
#camView video{width:100%;height:100%;object-fit:cover}
#camHint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:13px;color:#fff;text-shadow:0 0 4px #000}
</style>
</head>
<body>

<div id="app">
  <h2>📦 打包录像</h2>
  <div id="conn" class="conn-err">加载中...</div>

  <!-- Tracking input -->
  <div class="input-group">
    <label>快递单号（拍照自动填 或 手动输入）</label>
    <input type="text" id="trackingInput" placeholder="扫描或输入快递单号" inputmode="numeric" autocomplete="off">
  </div>

  <!-- Camera preview -->
  <div id="camView"><div id="camHint">将条码对准摄像头</div></div>

  <!-- Buttons -->
  <button class="btn btn-blue hid" id="btnScan">📸 重新扫码</button>
  <button class="btn btn-red hid" id="btnRecord">⏺ 开始录像</button>
  <button class="btn btn-green hid" id="btnUpload">☁️ 上传到电脑</button>
  <button class="btn btn-purple hid" id="btnNext">✅ 下一单</button>
  <div style="flex:1"></div>
</div>

<input type="file" id="recordInput" accept="video/*" capture="environment">
<div id="scanHelper"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/vendor/html5-qrcode.min.js"></script>
<script src="/js/camera.js"></script>
</body>
</html>
