<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打包录像管理系统</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.toolbar .btn{padding:8px 16px;font-size:13px}
</style>
</head>
<body class="dashboard-page">
<div class="dashboard">
  <header class="dash-header">
    <div class="dash-title"><h1>打包录像管理</h1><span class="dash-subtitle" id="connectionBadge">🟢 服务运行中</span></div>
    <div class="dash-actions"><button class="btn btn-sm" id="settingsToggle">设置</button></div>
  </header>

  <div class="search-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="搜索快递单号...">
    <input type="date" id="dateFrom" class="date-input" title="开始日期">
    <input type="date" id="dateTo" class="date-input" title="结束日期">
    <button id="searchBtn" class="btn btn-primary btn-sm">搜索</button>
    <button id="clearSearchBtn" class="btn btn-outline btn-sm">清除</button>
    <span class="search-result" id="searchResult"></span>
  </div>

  <div class="stats-bar" id="statsBar">
    <div class="stat-item"><span class="stat-value" id="statTotal">--</span><span class="stat-label">总视频数</span></div>
    <div class="stat-item"><span class="stat-value" id="statSize">--</span><span class="stat-label">总存储</span></div>
    <div class="stat-item"><span class="stat-value" id="statToday">--</span><span class="stat-label">今日新增</span></div>
    <div class="stat-item"><span class="stat-value" id="statFree">--</span><span class="stat-label">磁盘剩余</span></div>
  </div>

  <div class="toolbar">
    <input type="checkbox" id="selectAll" title="全选">
    <button class="btn btn-primary btn-sm" id="batchDownloadBtn">批量下载</button>
    <button class="btn btn-danger btn-sm" id="batchDeleteBtn">批量删除</button>
  </div>

  <div class="video-list" id="videoList">
    <div class="empty-state" id="emptyState"><div class="empty-icon">📹</div><p>暂无录像</p><p class="empty-hint">用手机打开 <code>/camera</code> 页面开始录制</p></div>
  </div>

  <div class="pagination hidden" id="pagination">
    <button id="prevPageBtn" class="btn btn-outline btn-sm">上一页</button>
    <span id="pageInfo">第 1 页</span>
    <button id="nextPageBtn" class="btn btn-outline btn-sm">下一页</button>
  </div>

  <div class="modal-overlay hidden" id="playerModal">
    <div class="modal-content">
      <div class="modal-header"><h3 id="playerTitle">视频播放</h3><button class="modal-close" id="closePlayer">✕</button></div>
      <video id="playerVideo" class="player-video" controls playsinline></video>
      <div class="modal-info" id="playerInfo"></div>
      <div class="modal-actions">
        <a class="btn btn-primary btn-sm" id="downloadVideoBtn" download style="text-decoration:none">下载MP4</a>
        <button class="btn btn-outline btn-sm" id="copyTrackingBtn">复制单号</button>
        <button class="btn btn-danger btn-sm" id="deleteVideoBtn">删除</button>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
