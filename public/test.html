<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>扫码测试v3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:monospace;overflow:hidden;height:100%}
#app{height:100%;display:flex;flex-direction:column}
#top{padding:12px 14px;background:#111;text-align:center;font-size:14px;flex-shrink:0}
#scan{flex:1;overflow:hidden;position:relative}
#scan video{object-fit:cover}
#msg{padding:10px;text-align:center;font-size:20px;font-weight:700;flex-shrink:0;min-height:44px}
.green{color:#4ade80}.red{color:#f87171}
</style></head>
<body>
<div id="app">
  <div id="top">扫码测试 — 对准快递条码</div>
  <div id="scan"></div>
  <div id="msg">启动中...</div>
</div>
<script src="/js/vendor/html5-qrcode.min.js"></script>
<script>
const msgEl=document.getElementById('msg');
const config={
  fps:10,
  disableFlip:true,
  aspectRatio:1.7
};

const scanner=new Html5Qrcode('scan');
scanner.start(
  {facingMode:'environment'},
  config,
  (text)=>{
    const clean=text.replace(/[^a-zA-Z0-9]/g,'');
    if(clean.length>=4){
      msgEl.textContent='✅ 识别: '+clean;
      msgEl.className='green';
      if(navigator.vibrate)navigator.vibrate(200);
    }
  },
  ()=>{}
).then(()=>{
  msgEl.textContent='🔍 扫码中...';
  msgEl.className='';
}).catch(err=>{
  msgEl.textContent='❌ 失败: '+(err.message||err).substring(0,60);
  msgEl.className='red';
  console.error(err);
});
</script>
</body></html>
